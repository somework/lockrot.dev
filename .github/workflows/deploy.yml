name: Deploy
# Four triggers, one build: a push to main (content, theme, blog), a lockrot release (the lockrot
# PHAR workflow sends `repository_dispatch` with event_type `lockrot-release` after it publishes the
# release, so the reference pages follow the newest tag), a weekly run that picks up a release whose
# dispatch never arrived, and a manual run.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [lockrot-release]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: scripts/build.sh
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # Tell the IndexNow engines — Bing, Yandex, Naver, Seznam; Google does not take part — which
      # pages this deploy changed. MkDocs stamps every page in the sitemap with the build date, so
      # `lastmod` cannot say what actually moved; `new-only` keeps a small state file between runs
      # and announces each page once per change. The sitemap is read from the checkout, so nothing
      # waits for the deploy to propagate. A search engine that will not listen is not a failed
      # deploy, hence `fail-on-error: false`.
      #
      # `key` is not a secret: the protocol proves ownership by serving it at
      # https://lockrot.dev/<key>.txt, which is content/38ddaaca504b025498fe10e1b956d1d3.txt here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - uses: indexnowkit/indexnow-action@77ce1f29f9abec488847db6d5c204aabb8f2a102 # v1.0.1
        with:
          key: 38ddaaca504b025498fe10e1b956d1d3
          base-url: https://lockrot.dev
          sitemap: site/sitemap.xml
          new-only: "true"
          fail-on-error: "false"
