name: Deploy
# Four triggers, one build: a push to main (content, theme, blog), a lockrot release (the lockrot
# PHAR workflow sends `repository_dispatch` with event_type `lockrot-release` after it publishes the
# release, so the reference pages follow the newest tag), a weekly run that picks up a release whose
# dispatch never arrived, and a manual run.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [lockrot-release]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sitemap's <lastmod> is the commit date of each page's source, so the build needs
          # the history, not just the tip. See scripts/mkdocs_hooks.py.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      - run: scripts/build.sh
      - uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
      # The report viewer, on a host of its own. It is a second Worker because response headers
      # decide it, not taste: see wrangler.viewer.jsonc. Built from the same lockrot checkout the
      # site was built from, so the renderer in it is the one that release ships.
      - run: scripts/build-viewer.sh
        env:
          # fetch-renderer.sh verifies the renderer release's build provenance with
          # `gh attestation verify`, which asks GitHub for the attestation.
          GH_TOKEN: ${{ github.token }}
      - id: viewer
        run: |
          set -eu
          if [ -d viewer-site ]; then echo "built=true" >> "$GITHUB_OUTPUT"; else echo "built=false" >> "$GITHUB_OUTPUT"; fi
      # A lockrot older than 0.10.0 ships no renderer, and build-viewer.sh says so and writes
      # nothing rather than failing. Deploying an empty directory over a working viewer would be
      # the worse answer, so the step is skipped instead.
      - if: steps.viewer.outputs.built == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.viewer.jsonc
      # Tell the IndexNow engines — Bing, Yandex, Naver, Seznam; Google does not take part — which
      # pages this deploy changed. `new-only` keeps a small state file between runs and announces a
      # page when its URL or its `lastmod` is new to that file, which is why scripts/mkdocs_hooks.py
      # puts the commit date of the page's source there instead of MkDocs' build date: a build date
      # makes every page look changed on the first deploy of each day. The sitemap is read from the
      # checkout, so nothing waits for the deploy to propagate. A search engine that will not listen
      # is not a failed deploy, hence `fail-on-error: false`.
      #
      # `key` is not a secret: the protocol proves ownership by serving it at
      # https://lockrot.dev/<key>.txt, which is content/38ddaaca504b025498fe10e1b956d1d3.txt here.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-
      - id: indexnow
        uses: indexnowkit/indexnow-action@5a2e9393d037a956f78134c7d00e08f1a8a881e2 # v1.0.2
        with:
          key: 38ddaaca504b025498fe10e1b956d1d3
          base-url: https://lockrot.dev
          sitemap: site/sitemap.xml
          new-only: "true"
          fail-on-error: "false"
      # The action reports through the step summary and its outputs; the log stays silent. One line
      # here says in the log what a deploy announced.
      - if: always()
        run: |
          echo "indexnow submitted=${{ steps.indexnow.outputs.submitted }}" \
               "skipped=${{ steps.indexnow.outputs.skipped }}" \
               "failed=${{ steps.indexnow.outputs.failed }}"
