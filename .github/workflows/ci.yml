name: CI
# Pull requests only: a push trigger next to it builds every PR branch twice. main is built by
# deploy.yml.
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sitemap's <lastmod> is the commit date of each page's source, so the build needs
          # the history, not just the tip. See scripts/mkdocs_hooks.py.
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
          cache: pip
      - run: pip install --require-hashes -r requirements.txt
      # The reference pages are fetched from lockrot's newest tag; a PR here is judged against what
      # the site would actually publish.
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: scripts/build.sh
        env:
          # Set between a lockrot release-PR merge and the rebuild from its tag, by schemas.yml: the
          # schema files of that commit, so a released document's $schema never answers 404. Empty
          # otherwise. See scripts/fetch-schemas.sh.
          SCHEMAS_REF: ${{ vars.SCHEMAS_REF }}
      # The viewer is deployed separately but assembled from the same lockrot checkout, and it
      # substitutes into markup this repository does not own: a release that reshapes report.html
      # should fail here rather than in a browser.
      - run: scripts/build-viewer.sh
        env:
          # fetch-renderer.sh verifies the renderer release's build provenance with
          # `gh attestation verify`, which asks GitHub for the attestation.
          GH_TOKEN: ${{ github.token }}
      # Internal links only: an external link check belongs to a scheduled job, not to every PR.
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --offline --root-dir "${{ github.workspace }}/site" --no-progress "site/**/*.html"
          fail: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site
